[package]
name = "adbreak-cli"
version = "0.1.0"
edition = "2024"
description = "The adbreak command: import recordings into a labelled dataset, suggest breaks (Comskip, captions, the detector), label them in a browser, and score detectors against the labels."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barm/adbreak"

[[bin]]
name = "adbreak"
path = "src/main.rs"

[dependencies]
adbreak = { path = "../adbreak" }
adbreak-captions = { path = "../adbreak-captions" }
adbreak-labels = { path = "../adbreak-labels" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "net"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
