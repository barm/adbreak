[package]
name = "adbreak-db"
version = "0.1.0"
edition = "2024"
description = "The adbreak dataset in SQLite: recordings, labels (with every save kept), and the automatic sources' suggestions."
license = "MIT OR Apache-2.0"
repository = "https://github.com/barm/adbreak"

[dependencies]
adbreak-labels = { path = "../adbreak-labels" }
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
