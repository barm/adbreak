[project]
name = "adbreak-ml"
version = "0.1.0"
description = "Training for adbreak: frame embeddings, per-second labels, baselines, later fusion and Core ML export"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "open_clip_torch>=3",
  "pillow>=11",
  "scikit-learn>=1.6",
  "timm>=1",
  "torch>=2.6",
]

[project.scripts]
adbreak-ml = "adbreak_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adbreak_ml"]
